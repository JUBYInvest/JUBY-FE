<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 탭 아이콘은 밤하늘 바탕에 호박·흰 캔들 둘(2026-11-02 그림, 11-08 색). 홈 화면에 더하면 뜨는 그림은 같은 그림의 PNG(iOS가 모서리를 깎는다) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 휴대폰 브라우저의 주소창 색. 머리글 띠와 같은 밤하늘(--color-band) -->
    <meta name="theme-color" content="#14213d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      본문 글꼴(Pretendard). 첫 그림을 막는 파일이라 연결(DNS·TLS)을 HTML을 읽는 즉시 시작한다 —
      preconnect가 없으면 이 CSS 요청에 가서야 연결을 맺어 느린 망에서 100~300ms가 더 걸렸다(2026-10-05).
      글꼴 파일(woff2)도 같은 호스트에서 오므로 한 번 맺은 연결을 같이 쓴다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
    <!-- JUBY 로고 전용. 400 하나만 제공되는 폰트다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Michroma&display=swap"
    />
    <!--
      화면마다 다른 제목은 src/hooks/useDocumentTitle.ts가 붙인다.
      여기 적은 값은 자바스크립트가 돌기 전에 잠깐 보이는 제목이다.
    -->
    <title>JUBY</title>
    <meta
      name="description"
      content="초보자를 위한 주식 비서 JUBY. 과거 데이터로 전략을 검증하는 백테스트와 투자성향에 맞춘 AI 주가분석을 제공합니다."
    />

    <!--
      카카오톡·슬랙에 링크를 붙였을 때 뜨는 미리보기.
      크롤러는 자바스크립트를 실행하지 않아 화면별로 다르게 줄 수 없다 —
      어느 주소를 붙이든 아래 한 벌이 뜬다. 종목별 미리보기를 하려면 서버가 미리 그려야 한다.
      og:image는 절대주소여야 해서 배포 주소를 적었다. 주소가 바뀌면(예: juby.store 아래로 옮기면) 여기도 바꾼다.
      그림은 public/og.png(1200×630). 파비콘(밤하늘 바탕에 호박·흰 캔들 둘)과 로고 글꼴(Michroma)로 만들었다 — 흰 바탕, 2026-11-02 그림, 11-08 색.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUBY" />
    <meta property="og:title" content="JUBY - 초보자를 위한 주식 비서" />
    <meta
      property="og:description"
      content="과거 데이터로 전략을 검증하는 백테스트와 투자성향에 맞춘 AI 주가분석."
    />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://juby-fe.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JUBY - 초보자를 위한 주식 비서" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
